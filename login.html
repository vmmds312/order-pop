<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login – MDS</title>
<style>
:root{--bg1:#fff1f2;--bg2:#fde2e4;--card:rgba(255,255,255,.55);--tx:#2a0a0e;--mu:#8a5a60;--bd:rgba(255,255,255,.9);--sh:rgba(190,30,45,.14);--r1:#ef3b4a;--r2:#b3001b;--ph:#a07178;--blob:#f9c3c8}
:root[data-theme="dark"]{--bg1:#1d0b0e;--bg2:#2c1014;--card:rgba(255,255,255,.07);--tx:#fbe9ea;--mu:#c08b91;--bd:rgba(255,255,255,.12);--sh:rgba(0,0,0,.4);--ph:#b5848a;--blob:#4a1a20;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow-x:hidden;display:flex;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.blob{position:fixed;border-radius:50%;background:var(--blob);opacity:.7;z-index:0}
.b1{width:260px;height:260px;left:-110px;top:-90px}.b2{width:150px;height:150px;right:-70px;top:30%}.b3{width:300px;height:300px;right:-120px;bottom:-130px}
.wrap{position:relative;z-index:1;width:100%;max-width:400px;padding:28px 24px;display:flex;flex-direction:column;justify-content:center;min-height:100%}
.theme{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer;box-shadow:0 6px 16px var(--sh)}
.logo{width:120px;height:120px;margin:0 auto 22px;border-radius:34px;border:1px solid var(--bd);background:var(--card);box-shadow:0 14px 34px var(--sh),inset 0 2px 6px rgba(255,255,255,.6);display:grid;place-items:center;font-size:38px;font-weight:800;letter-spacing:2px;background-image:linear-gradient(135deg,var(--r1),var(--r2));-webkit-background-clip:padding-box;color:#fff}
h1{text-align:center;font-size:30px;margin:0}
.sub{text-align:center;color:var(--mu);letter-spacing:.2em;font-size:13px;margin:6px 0 24px}
.f{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;margin-bottom:12px;border-radius:18px;border:1px solid var(--bd);background:var(--card);box-shadow:0 6px 18px var(--sh);backdrop-filter:blur(8px)}
.f svg{width:22px;height:22px;stroke:var(--mu);fill:none;stroke-width:1.8;flex:none}
.f input{flex:1;border:0;outline:0;background:transparent;color:var(--tx);font:inherit;min-width:0}
.f input::placeholder{color:var(--ph)}
.eye{background:none;border:0;padding:0;cursor:pointer;display:grid}
.opt{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin:4px 0 18px}
.opt label{display:flex;gap:8px;align-items:center;cursor:pointer}
.opt input{accent-color:var(--r2);width:20px;height:20px}
.opt a{color:var(--r2);font-weight:600;text-decoration:none}
.go{width:100%;height:56px;border:0;border-radius:999px;background:linear-gradient(90deg,var(--r1),var(--r2));color:#fff;font:600 18px inherit;font-family:inherit;cursor:pointer;box-shadow:0 10px 26px rgba(179,0,27,.38)}
.go:disabled{opacity:.6}
.fp{display:none;width:100%;height:52px;margin-top:12px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 15px inherit;font-family:inherit;cursor:pointer;box-shadow:0 6px 18px var(--sh)}
.msg{min-height:20px;margin-top:12px;text-align:center;color:var(--r2);font-size:14px}
input::-ms-reveal,input::-ms-clear{display:none}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main class="wrap">
  <button class="theme" id="theme" aria-label="Ganti tema">☾</button>
  <div class="logo">MDS</div>
  <h1>Selamat Datang</h1>
  <div class="sub">MASUK UNTUK LANJUT</div>
  <div class="f">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>
    <input id="u" placeholder="Username" autocomplete="username" autocapitalize="none">
  </div>
  <div class="f">
    <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
    <input id="p" type="password" placeholder="Password" autocomplete="current-password">
    <button class="eye" id="eye" aria-label="Lihat password"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <div class="opt">
    <label><input type="checkbox" id="rem" checked> Ingat saya</label>
    <a href="#" id="forgot">Lupa password?</a>
  </div>
  <button class="go" id="go">Masuk</button>
  <button class="fp" id="fp">☝ Masuk dengan sidik jari</button>
  <div class="msg" id="msg"></div>
</main>
<script>
// ====== ISI DUA BARIS INI ======
const API = "https://script.google.com/macros/s/AKfycbyBUi8HxG_wkn6MQirdW-dR-a4lIPDnb5FsbVM94ekQhQ3upP13TE9g71Wtl7kdlNnV/exec";   // URL Web App dari Apps Script (berakhiran /exec)
const NEXT = "orders.html";                    // halaman tujuan setelah login
// ===============================
const $ = id => document.getElementById(id);
const say = t => $("msg").textContent = t;
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));

async function call(body){
  const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)});
  return r.json();
}
function saveSession(token, remember, username){
  (remember ? localStorage : sessionStorage).setItem("mds_token", token);
  sessionStorage.setItem("mds_token", token);
  sessionStorage.setItem("mds_user", username);
}
async function enrollFingerprint(token, username){
  try{
    const cred = await navigator.credentials.create({publicKey:{
      challenge:rnd(32), rp:{name:"MDS"},
      user:{id:new TextEncoder().encode(username), name:username, displayName:username},
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
      authenticatorSelection:{authenticatorAttachment:"platform", userVerification:"required"}, timeout:60000}});
    localStorage.setItem("mds_cred", b64(cred.rawId));
    localStorage.setItem("mds_fp_token", token);
  }catch(e){}
}
$("go").onclick = async () => {
  const username = $("u").value.trim(), password = $("p").value;
  if(!username || !password){ say("Isi username dan password."); return }
  if(API.startsWith("GANTI")){ say("URL Apps Script belum diisi."); return }
  $("go").disabled = true; say("Memeriksa…");
  try{
    const r = await call({action:"login", username, password});
    if(!r.ok){ say(r.error==="nonaktif" ? "Akun nonaktif." : "Username atau password salah."); return }
    saveSession(r.token, $("rem").checked, r.username);
    if(window.PublicKeyCredential && !localStorage.getItem("mds_cred") && confirm("Aktifkan login dengan sidik jari di HP ini?"))
      await enrollFingerprint(r.token, r.username);
    location.href = NEXT;
  }catch(e){ say("Tidak bisa terhubung. Coba lagi.") }
  finally{ $("go").disabled = false }
};
$("fp").onclick = async () => {
  try{
    say("Tempelkan jari…");
    await navigator.credentials.get({publicKey:{challenge:rnd(32), timeout:60000, userVerification:"required",
      allowCredentials:[{type:"public-key", id:unb64(localStorage.getItem("mds_cred"))}]}});
    const token = localStorage.getItem("mds_fp_token");
    const r = await call({action:"verify", token});
    if(!r.ok){ say("Sesi habis. Masuk dengan password."); localStorage.removeItem("mds_fp_token"); $("fp").style.display="none"; return }
    sessionStorage.setItem("mds_token", token); sessionStorage.setItem("mds_user", r.username);
    location.href = NEXT;
  }catch(e){ say("Sidik jari dibatalkan atau gagal.") }
};
["u","p"].forEach(id => $(id).addEventListener("keydown", e => { if(e.key==="Enter") $("go").click() }));
$("eye").onclick = () => { const p=$("p"); p.type = p.type==="password" ? "text" : "password" };
$("forgot").onclick = e => { e.preventDefault(); say("Hubungi admin untuk reset password.") };
$("theme").onclick = () => {
  const d = document.documentElement, dark = d.dataset.theme==="dark";
  d.dataset.theme = dark ? "light" : "dark"; $("theme").textContent = dark ? "☾" : "☀";
};
if(matchMedia("(prefers-color-scheme: dark)").matches){ document.documentElement.dataset.theme="dark"; $("theme").textContent="☀" }
if(window.PublicKeyCredential && localStorage.getItem("mds_cred") && localStorage.getItem("mds_fp_token")) $("fp").style.display="block";
</script>
</body>
</html>
